services:
  - type: web
    name: second-brain-api
    runtime: docker
    dockerfilePath: api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECOND_BRAIN_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
