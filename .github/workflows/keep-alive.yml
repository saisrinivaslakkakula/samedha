name: Keep Render services alive

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:          # manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (warms Render + Neon)
        run: curl -sf https://api.saisrinivasl.me/health

      - name: Ping Website
        run: curl -sf https://samedha-app.onrender.com
